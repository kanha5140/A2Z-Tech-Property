<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Property Purchaser Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 25px;
    }

    .form-box {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      background: #0072ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #0059cc;
    }
  </style>
</head>

<body>

  <div class="form-box">
    <h2>Industrial Property Purchaser Form</h2>

    <form>

      <!-- Buyer Information -->
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Mobile Number</label>
      <input type="tel" placeholder="Enter mobile number" required>

      <label>Email (Optional)</label>
      <input type="email" placeholder="Enter email">

      <label>Company Name (Optional)</label>
      <input type="text" placeholder="Enter company name">

      <!-- Property Requirements -->
      <label for="industrialType">Industrial Property Type Required</label>

      <select id="industrialType" name="industrialType" required onchange="showOtherIndustrial()">
        <option value="">Select</option>
        <option>Industrial Land</option>
        <option>Industrial Shed</option>
        <option>Factory Building</option>
        <option>Warehouse / Godown</option>
        <option>Manufacturing Unit</option>
        <option>Cold Storage</option>
        <option value="other">Other (Specify)</option>
      </select>

      <input type="text" id="industrialOther" name="industrialOther" placeholder="Please specify"
        style="display:none; margin-top:8px;">

      <script>
        function showOtherIndustrial() {
          const select = document.getElementById("industrialType");
          const input = document.getElementById("industrialOther");

          if (select.value === "other") {
            input.style.display = "block";
            input.required = true;
          } else {
            input.style.display = "none";
            input.required = false;
            input.value = "";
          }
        }
      </script>


      <label>Preferred Location</label>
      <input type="text" placeholder="Industrial estate / area / city" required>

      <label>Total Land Area Required</label>
      <select required>
        <option value="">Select</option>
        <option>5,000 – 10,000 sqft</option>
        <option>10,000 – 20,000 sqft</option>
        <option>½ Acre</option>
        <option>1 Acre</option>
        <option>2–5 Acres</option>
        <option>More than 5 Acres</option>
      </select>

      <label>Built-up Area Requirement (If any)</label>
      <input type="text" placeholder="Example: 3,000 sqft shed / RCC building">

      <label>Height Requirement (For Shed)</label>
      <select>
        <option>Any</option>
        <option>15 ft</option>
        <option>18 ft</option>
        <option>22 ft</option>
        <option>25 ft+</option>
      </select>

      <label>Crane Requirement</label>
      <select>
        <option>No</option>
        <option>5 Ton</option>
        <option>10 Ton</option>
        <option>15 Ton</option>
        <option>20 Ton+</option>
      </select>

      <label>Power Load Requirement</label>
      <select>
        <option>Basic</option>
        <option>10 HP</option>
        <option>25 HP</option>
        <option>50 HP</option>
        <option>100 HP+</option>
      </select>

      <label>Road Access Required</label>
      <select>
        <option>Any</option>
        <option>20 ft Road</option>
        <option>30 ft Road</option>
        <option>40 ft Road</option>
        <option>Truck Movement Required</option>
        <option>Highway Touch Preferred</option>
      </select>

      <label>Water Requirement</label>
      <select>
        <option>No Water Needed</option>
        <option>Borewell</option>
        <option>Industrial Water Supply</option>
      </select>

      <label>Documents Requirement</label>
      <select required>
        <option>Clear Title</option>
        <option>Freehold Land</option>
        <option>Leasehold Acceptable</option>
        <option>Any (Will verify)</option>
      </select>

      <label>Purpose of Purchase</label>
      <select required>
        <option>Factory Setup</option>
        <option>Warehouse Storage</option>
        <option>Manufacturing</option>
        <option>Industrial Investment</option>
        <option>Cold Storage Unit</option>
      </select>

      <label>Total Budget (₹)</label>
      <input type="text" placeholder="Example: ₹50 lakh – ₹3 crore" required>

      <label>Timeline to Purchase</label>
      <select required>
        <option>Immediately</option>
        <option>Within 1 Month</option>
        <option>Within 3 Months</option>
        <option>Just Checking</option>
      </select>

      <label>Preferred Site Visit Date</label>
      <input type="date">

      <!-- Legal & Documentation Section -->
      <div class="bg-gray-50 p-6 rounded-lg">
        <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
          <i class="fas fa-file-contract mr-2 text-orange-600"></i> Legal & Documentation
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="input-icon">
            <i class="fas fa-file-alt"></i>
            <select name="khataType" id="khataType"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required onchange="showKhataOther()">

              <option value="">Khata Type</option>
              <option value="Sabik">Sabik</option>
              <option value="Hal">Hal</option>
              <option value="Kisam">Kisam</option>
              <option value="other">Other (Specify)</option>
            </select>

            <input type="text" id="khataOther" name="khataOther" placeholder="Please specify Khata Type"
              class="w-full border border-gray-300 p-3 rounded-lg mt-2" style="display:none;">

            <script>
              function showKhataOther() {
                const select = document.getElementById("khataType");
                const input = document.getElementById("khataOther");

                if (select.value === "other") {
                  input.style.display = "block";
                  input.required = true;
                } else {
                  input.style.display = "none";
                  input.required = false;
                  input.value = "";
                }
              }
            </script>
          </div>
          <div class="input-icon">
            <i class="fas fa-ruler-combined"></i>
            <input type="text" name="Khatanumber" placeholder="Khata Number(e.g., 1200, 3400)"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required />
          </div>

          <div class="input-icon">
            <i class="fas fa-ruler-combined"></i>
            <input type="text" name="plotNumber" placeholder="Plot Number (e.g., B1, C2 )"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required />
          </div>


          <div class="input-icon">
            <i class="fas fa-exchange-alt"></i>
            <select name="Religious"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option value="">Religious Restriction?</option>
              <option value="Hindu">Hindu</option>
              <option value="Muslim">Muslim</option>
              <option value="Sikh">Sikh</option>
              <option value="Christian">Christian</option>
              <option value="Buddh"> budh</option>
              <option value="Jain">Jain</option>
            </select>
          </div>


          <div class="input-icon">
            <i class="fas fa-exchange-alt"></i>
            <select name="Cast"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option value="">Caste Restriction?</option>
              <option value="General">General</option>
              <option value="OBC (Other Backward Classes)">OBC (Other Backward Classes)</option>
              <option value="SC (Scheduled Cast)">SC (Scheduled Cast)</option>
              <option value="ST(Scheduled Type)">ST (Scheduled Type)</option>

            </select>
          </div>

          <div class="input-icon">
            <i class="fas fa-exchange-alt"></i>
            <select name="mutation"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option value="">Mutation Done?</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="input-icon">
            <i class="fas fa-border-all"></i>
            <select name="boundary"
              class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required>
              <option value="">Boundary Wall?</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Additional Information -->
      <label>Additional Requirements (Optional)</label>
      <textarea rows="4" placeholder="Boundary wall needed? Truck parking? Office space? etc."></textarea>

      <label>How Did You Hear About Us?</label>
      <select>
        <option>Google</option>
        <option>WhatsApp</option>
        <option>Social Media</option>
        <option>Referral</option>
        <option>Other</option>
      </select>

      <button type="submit">Submit</button>

    </form>
  </div>

</body>

</html>
