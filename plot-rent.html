<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Forms</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            background-color: #ddd;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-button.active {
            background-color: #28a745;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .radio-group label {
            font-weight: normal;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #218838;
        }

        .optional {
            font-style: italic;
            color: #777;
        }

        /* Specific styles for owner form */
        .owner-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .owner-form label {
            margin-top: 15px;
        }

        .owner-form input,
        .owner-form select,
        .owner-form textarea {
            margin-top: 6px;
            margin-bottom: 0;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        .owner-form button {
            margin-top: 25px;
            background: #0a6b3c;
        }

        .owner-form button:hover {
            background: #074f2b;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>Rent a Property </h1>
        <div class="tabs">
            <button class="tab-button active" onclick="showTab(0)">Buyer Form</button>
            <button class="tab-button" onclick="showTab(1)">Owner Form</button>
        </div>

        <div id="buyer-tab" class="tab-content active">
            <form id="submit-to-google">
                <div class="section">
                    <h2>Property (Plot) – Buyer Form</h2>
                    <h2>1️⃣ Personal Details</h2>
                    <label for="fullName">Full Name</label>
                    <input type="text" name="fullName" required>

                    <label for="mobile">Mobile Number</label>
                    <input type="tel" name="mobile" required>

                    <label for="altMobile">Alternate Mobile <span class="optional">(Optional)</span></label>
                    <input type="tel" name="altMobile">

                    <label for="email">Email ID <span class="optional">(Optional)</span></label>
                    <input type="email" name="email">
                </div>

                <div class="section">
                    <h2>2️⃣ Plot Requirement</h2>
                    <label for="location">City / Location Preference</label>
                    <input type="text" name="location" required>

                    <label>Plot Type</label>
                    <select id="plotType" name="plotType" required onchange="showOtherPlotInput()">
                        <option value="">Select Plot Type</option>
                        <option>Residential</option>
                        <option>Commercial</option>
                        <option>Agricultural</option>
                        <option>Industrial</option>
                        <option>Farm House</option>
                        <option value="other">Other (Write Manually)</option>
                    </select>

                    <input type="text" id="otherPlotTypeInput" name="otherPlotTypeInput" placeholder="Enter plot type"
                        style="display:none; margin-top:10px;">

                    <label for="plotSize">Plot Size (sqft / decimals / acres)</label>
                    <input type="text" name="plotSize" placeholder="e.g., 1200 sqft or 2 acres" required>

                    <label for="budgetMin">Budget Range - Minimum</label>
                    <input type="number" name="budgetMin" min="0" required>

                    <label for="budgetMax">Budget Range - Maximum</label>
                    <input type="number" name="budgetMax" min="0" required>
                </div>

                <div class="section">
                    <h2>3️⃣ Purpose of Buying</h2>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" value="Self House" required> Self House</label>
                        <label><input type="radio" name="purpose" value="Investment"> Investment</label>
                        <label><input type="radio" name="purpose" value="Commercial Purpose"> Commercial Purpose</label>
                    </div>
                </div>

                <button type="submit" id="submitBtn">Submit Form</button>
            </form>
            <script>
                // Toggle "Other" input field
                function showOtherPlotInput() {
                    const select = document.getElementById('plotType');
                    const otherInput = document.getElementById('otherPlotTypeInput');
                    otherInput.style.display = select.value === 'other' ? 'block' : 'none';
                    if (select.value !== 'other') otherInput.value = '';
                }

                // Submit to Google Sheets
                const scriptURL = 'https://script.google.com/macros/s/AKfycbz1Nl0H-1M6Vfz_ffzuUKav7wGP6KsDSWUTUbc_9Ftpm30z2FeEpuvdu2Y-zgzsK4A/exec'; // PASTE YOUR URL HERE
                const form = document.getElementById('submit-to-google');
                const btn = document.getElementById('submitBtn');

                form.addEventListener('submit', e => {
                    e.preventDefault();
                    btn.disabled = true;
                    btn.innerHTML = "Sending...";

                    fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                        .then(response => {
                            alert("Success! Your requirements have been submitted.");
                            form.reset();
                            showOtherPlotInput(); // Hide the "other" field again
                            btn.disabled = false;
                            btn.innerHTML = "Submit Form";
                        })
                        .catch(error => {
                            console.error('Error!', error.message);
                            alert("Something went wrong. Please try again.");
                            btn.disabled = false;
                            btn.innerHTML = "Submit Form";
                        });
                });
            </script>
        </div>

        <div id="owner-tab" class="tab-content">
            <form action="#" method="post" class="owner-form">
                <h2>Property Rent – Owner Form</h2>
                <label>Owner Name</label>
                <input type="text" required>

                <label>Mobile Number</label>
                <input type="tel" required>

                <label>Property Type</label>
                <select id="propertyType" required onchange="showOtherPropertyType()">
                    <option value="">Select Property Type</option>
                    <option>Residential House</option>
                    <option>Flat / Apartment</option>
                    <option>Shop</option>
                    <option>Godown / Warehouse</option>
                    <option>Office Space</option>
                    <option>Commercial Space</option>

                    <!-- Manual Entry -->
                    <option value="other">Other (Write Manually)</option>
                </select>

                <!-- Hidden Input -->
                <input type="text" id="otherPropertyTypeInput" placeholder="Enter property type"
                    style="display:none; margin-top:10px;">

                <script>
                    function showOtherPropertyType() {
                        const selectBox = document.getElementById("propertyType");
                        const otherInput = document.getElementById("otherPropertyTypeInput");

                        if (selectBox.value === "other") {
                            otherInput.style.display = "block";
                            otherInput.required = true;
                        } else {
                            otherInput.style.display = "none";
                            otherInput.required = false;
                            otherInput.value = "";
                        }
                    }
                </script>

                <label>Property Location</label>
                <input type="text" placeholder="Area / Landmark / City" required>

                <label>Property Size (Sqft)</label>
                <input type="number" placeholder="Example: 1200 sqft">

                <label>Floor</label>
                <select>
                    <option>Ground Floor</option>
                    <option>1st Floor</option>
                    <option>2nd Floor</option>
                    <option>Above 3rd Floor</option>
                </select>

                <label>Expected Rent (₹)</label>
                <input type="text" placeholder="Example: ₹8,000 / ₹25,000">

                <label>Security Deposit (Optional)</label>
                <input type="text">

                <label>Furnishing Status</label>
                <select>
                    <option>Unfurnished</option>
                    <option>Semi-Furnished</option>
                    <option>Fully Furnished</option>
                </select>

                <label>Preferred Tenant Type</label>
                <select>
                    <option>Family</option>
                    <option>Bachelor</option>
                    <option>Working Professionals</option>
                    <option>Company Lease</option>
                </select>

                <label>Property Photos Upload</label>
                <input type="file" multiple>

                <label>Property Description</label>
                <textarea rows="4" placeholder="Rooms, amenities, parking, water supply, restrictions, etc."></textarea>

                <button type="submit">Submit Property</button>
            </form>
        </div>
    </div>

    <script>
        function showTab(tabIndex) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');
            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));
            tabs[tabIndex].classList.add('active');
            buttons[tabIndex].classList.add('active');
        }
    </script>
</body>

</html>
