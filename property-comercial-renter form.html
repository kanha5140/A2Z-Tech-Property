<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Rent Forms</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            background-color: #ddd;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px 8px 0 0;
        }

        .tab-button.active {
            background-color: #28a745;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .container {
            max-width: 820px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0a6b3c;
            color: white;
            border: none;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #074f2b;
        }

        .renter-button {
            background: #0072ff;
        }

        .renter-button:hover {
            background: #0059cc;
        }
    </style>
</head>

<body>
    <div class="tabs">
        <button class="tab-button active" onclick="showTab(0)">Renter Form</button>
        <button class="tab-button" onclick="showTab(1)">Owner Form</button>
    </div>

    <div class="tab-content active">
        <div class="container">
            <h2>Commercial Renters Requirement Form</h2>

            <form>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter mobile number" required>

                <label>Email (Optional)</label>
                <input type="email" placeholder="Enter email">
                <label>Required Commercial Property Type</label>
                <select id="commercialType" required onchange="showOtherCommercialType()">
                    <option value="">Select</option>
                    <option>Shop</option>
                    <option>Office Space</option>
                    <option>Showroom</option>
                    <option>Godown / Warehouse</option>
                    <option>Industrial Shed</option>
                    <option>Commercial Building Floor</option>

                    <!-- Manual Entry -->
                    <option value="other">Other (Write Manually)</option>
                </select>

                <!-- Hidden input box -->
                <input type="text" id="otherCommercialTypeInput" placeholder="Enter commercial property type"
                    style="display:none; margin-top:10px;">

                <script>
                    function showOtherCommercialType() {
                        const selectBox = document.getElementById("commercialType");
                        const otherInput = document.getElementById("otherCommercialTypeInput");

                        if (selectBox.value === "other") {
                            otherInput.style.display = "block";
                            otherInput.required = true;
                        } else {
                            otherInput.style.display = "none";
                            otherInput.required = false;
                            otherInput.value = "";
                        }
                    }
                </script>


                <label>Preferred Location</label>
                <input type="text" placeholder="Area / City Name" required>

                <label>Business Type / Usage Purpose</label>
                <input type="text" placeholder="Retail, Office, Storage, Agency, Service Centre, Franchise etc."
                    required>

                <label>Carpet Area Required (sqft)</label>
                <input type="text" placeholder="Example: 300 – 1200 sqft" required>

                <label>Budget Range per Month (₹)</label>
                <input type="text" placeholder="Example: ₹10,000 – ₹25,000" required>

                <label>Preferred Floor</label>
                <select>
                    <option>No Preference</option>
                    <option>Ground Floor</option>
                    <option>1st Floor</option>
                    <option>2nd Floor</option>
                    <option>Basement</option>
                </select>

                <label>Frontage Requirement (ft)</label>
                <input type="text" placeholder="Optional">

                <label>Parking Requirement</label>
                <select>
                    <option>No Parking Needed</option>
                    <option>2 Wheeler</option>
                    <option>4 Wheeler</option>
                    <option>Both</option>
                </select>

                <label>Power Load Requirement (kW)</label>
                <input type="text" placeholder="Example: 3 kW / 5 kW / 10 kW">

                <label>Washroom Requirement</label>
                <select>
                    <option>Not Required</option>
                    <option>Common Washroom</option>
                    <option>Attached Washroom</option>
                </select>

                <label>Furnishing Requirement</label>
                <select>
                    <option>Unfurnished</option>
                    <option>Semi-Furnished</option>
                    <option>Fully Furnished</option>
                </select>

                <label>Agreement Tenure Preference</label>
                <select>
                    <option>11 Months</option>
                    <option>1 Year</option>
                    <option>3 Years</option>
                    <option>5 Years</option>
                    <option>Flexible</option>
                </select>

                <label>Move-in Time</label>
                <select>
                    <option>Immediately</option>
                    <option>Within 1 Month</option>
                    <option>1–3 Months</option>
                    <option>Just Exploring Options</option>
                </select>

                <label>Site Visit Preferred Date</label>
                <input type="date">

                <label>Additional Requirements</label>
                <textarea rows="3"
                    placeholder="Front shutter, high ceiling, storage room, loading area, fire safety, lift etc."></textarea>

                <label>How Did You Hear About Us?</label>
                <select>
                    <option>Google</option>
                    <option>WhatsApp</option>
                    <option>Facebook / Instagram</option>
                    <option>Reference</option>
                    <option>Other</option>
                </select>

                <button type="submit">Submit Requirement</button>

            </form>
        </div>
    </div>

    <div class="tab-content">
        <div class="container">
            <h2>Commercial Property Rent Owner Form</h2>
            <form>

                <label>Owner Name</label>
                <input type="text" placeholder="Enter full name" required>

                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter mobile number" required>

                <label>Email (Optional)</label>
                <input type="email" placeholder="Enter email">
                <label>Commercial Property Type</label>
                <select id="commercialPropertyType" required onchange="showOtherCommercialProperty()">
                    <option value="">Select</option>
                    <option>Shop</option>
                    <option>Office Space</option>
                    <option>Showroom</option>
                    <option>Godown / Warehouse</option>
                    <option>Industrial Shed</option>
                    <option>Commercial Building</option>
                    <option>Commercial Land</option>

                    <!-- Manual Option -->
                    <option value="other">Other (Write Manually)</option>
                </select>

                <!-- Hidden Input for Manual Entry -->
                <input type="text" id="otherCommercialPropertyInput" placeholder="Enter commercial property type"
                    style="display:none; margin-top:10px;">

                <script>
                    function showOtherCommercialProperty() {
                        const selectBox = document.getElementById("commercialPropertyType");
                        const otherInput = document.getElementById("otherCommercialPropertyInput");

                        if (selectBox.value === "other") {
                            otherInput.style.display = "block";
                            otherInput.required = true;
                        } else {
                            otherInput.style.display = "none";
                            otherInput.required = false;
                            otherInput.value = "";
                        }
                    }
                </script>


                <label>Property Address</label>
                <textarea rows="3" placeholder="Full address with landmark" required></textarea>

                <label>Carpet Area (Sqft)</label>
                <input type="text" placeholder="Example: 350 sqft / 2500 sqft">

                <label>Built-up Area (Sqft)</label>
                <input type="text" placeholder="Optional">

                <label>Floor</label>
                <select>
                    <option>Ground Floor</option>
                    <option>1st Floor</option>
                    <option>2nd Floor</option>
                    <option>Upper Floors</option>
                    <option>Basement</option>
                </select>

                <label>Frontage (ft)</label>
                <input type="text" placeholder="Example: 15 ft / 25 ft">

                <label>Road Size (ft)</label>
                <input type="text" placeholder="Example: 20 ft / 40 ft">

                <label>Monthly Rent (₹)</label>
                <input type="text" placeholder="Expected rent per month" required>

                <label>Security Deposit (₹)</label>
                <input type="text" placeholder="Example: 50,000 / 2 Months rent">

                <label>Minimum Lock-in Period</label>
                <select>
                    <option>No Lock-in</option>
                    <option>6 Months</option>
                    <option>1 Year</option>
                    <option>2 Years</option>
                </select>

                <label>Lease Agreement Tenure</label>
                <select>
                    <option>11 Months</option>
                    <option>1 Year</option>
                    <option>3 Years</option>
                    <option>5 Years</option>
                    <option>Flexible</option>
                </select>

                <label>Parking Availability</label>
                <select>
                    <option>No Parking</option>
                    <option>2 Wheeler</option>
                    <option>4 Wheeler</option>
                    <option>Both</option>
                </select>

                <label>Amenities</label>
                <textarea rows="3"
                    placeholder="Power backup, lift, washroom, shutter, loading area, fire safety, etc."></textarea>

                <label>Property Availability</label>
                <select>
                    <option>Immediate</option>
                    <option>Within 1 Month</option>
                    <option>1–3 Months</option>
                    <option>After 3 Months</option>
                </select>

                <label>Upload Property Images (Optional)</label>
                <input type="file" multiple>

                <label>Additional Details</label>
                <textarea rows="3" placeholder="Any special condition, usage restrictions, etc."></textarea>

                <label>How Did You Hear About Us?</label>
                <select>
                    <option>Google</option>
                    <option>WhatsApp</option>
                    <option>Social Media</option>
                    <option>Reference</option>
                    <option>Other</option>
                </select>

                <button type="submit">Submit Property</button>

            </form>

        </div>
    </div>

    <script>
        function showTab(tabIndex) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');
            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));
            tabs[tabIndex].classList.add('active');
            buttons[tabIndex].classList.add('active');
        }
    </script>
</body>

</html>
