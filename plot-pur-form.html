<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property (Plot) – Buyer Form</title>
    <link rel="icon" href="logo.png" type="image/png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            max-width: 640px;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: bold;
        }

        .section h2 {
            font-size: 18px;
            color: #444;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ddd;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input:focus,
        select:focus {
            border-color: #2b8cff;
            box-shadow: 0 0 8px rgba(43, 140, 255, 0.3);
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        button:hover {
            background: #0066d6;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #successMsg {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 17px;
            display: none;
            animation: pop 0.4s ease-in-out;
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .optional {
            font-style: italic;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Property (Plot) – Buyer Form</h1>

        <form id="plotForm">

            <div class="section">
                <h2>1️⃣ Personal Details</h2>

                <label>Full Name</label>
                <input type="text" id="fullName" name="fullName" required>

                <label>Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" required>

                <label>Alternate Mobile <span class="optional">(Optional)</span></label>
                <input type="tel" id="altMobile" name="altMobile">

                <label>Email ID <span class="optional">(Optional)</span></label>
                <input type="email" id="email" name="email">
            </div>

            <div class="section">
                <h2>2️⃣ Plot Requirement</h2>

                <label>City / Location Preference</label>
                <input type="text" id="location" name="location" required>
                <label>Plot Type</label>
                <select id="plotType" id="plotType" name="plotType" required onchange="showOtherPlotInput()">
                    <option value="">Select Plot Type</option>
                    <option>Residential</option>
                    <option>Commercial</option>
                    <option>Agricultural</option>
                    <option>Industrial</option>
                    <option>Farm House</option>

                    <!-- Manual Entry -->
                    <option value="other">Other (Write Manually)</option>
                </select>

                <!-- Input Box For Manual Entry -->
                <input type="text" id="otherPlotTypeInput" placeholder="Enter plot type"
                    style="display:none; margin-top:10px;">

                <script>
                    function showOtherPlotInput() {
                        const selectBox = document.getElementById("plotType");
                        const otherInput = document.getElementById("otherPlotTypeInput");

                        if (selectBox.value === "other") {
                            otherInput.style.display = "block";
                            otherInput.required = true;
                        } else {
                            otherInput.style.display = "none";
                            otherInput.required = false;
                            otherInput.value = "";
                        }
                    }
                </script>


                <label>Plot Size</label>
                <input type="text" id="plotSize" name="plotSize" placeholder="e.g., 1200 sqft / 2 acres" required>

                <label>Budget Minimum</label>
                <input type="number" id="budgetMin" name="budgetMin" required>

                <label>Budget Maximum</label>
                <input type="number" id="budgetMax" name="budgetMax" required>
            </div>

            <!-- Legal & Documentation Section -->
            <div class="bg-gray-50 p-6 rounded-lg">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-file-contract mr-2 text-orange-600"></i> Legal & Documentation
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="input-icon">
                        <i class="fas fa-file-alt"></i>
                        <select name="khataType" id="khataType" name="khataType"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required onchange="showKhataOther()">

                            <option value="">Khata Type</option>
                            <option value="Sabik">Sabik</option>
                            <option value="Hal">Hal</option>
                            <option value="Kisam">Kisam</option>
                            <option value="other">Other (Specify)</option>
                        </select>

                        <input type="text" id="khataOther" name="khataOther" placeholder="Please specify Khata Type"
                            class="w-full border border-gray-300 p-3 rounded-lg mt-2" style="display:none;">

                        <script>
                            function showKhataOther() {
                                const select = document.getElementById("khataType");
                                const input = document.getElementById("khataOther");

                                if (select.value === "other") {
                                    input.style.display = "block";
                                    input.required = true;
                                } else {
                                    input.style.display = "none";
                                    input.required = false;
                                    input.value = "";
                                }
                            }
                        </script>

                    </div>
                    <div class="input-icon">
                        <i class="fas fa-ruler-combined"></i>
                        <input type="text" id="Khatanumber" name="Khatanumber"
                            placeholder="Khata Number(e.g., 1200, 3400)"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required />
                    </div>

                    <div class="input-icon">
                        <i class="fas fa-ruler-combined"></i>
                        <input type="text" id="plotNumber" name="plotNumber" placeholder="Plot Number (e.g., B1, C2 )"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required />
                    </div>


                    <div class="input-icon">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="Religious" name="Religious"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value="">Religious Restriction?</option>
                            <option value="Hindu">Hindu</option>
                            <option value="Muslim">Muslim</option>
                            <option value="Sikh">Sikh</option>
                            <option value="Christian">Christian</option>
                            <option value="Buddh"> budh</option>
                            <option value="Jain">Jain</option>
                        </select>
                    </div>


                    <div class="input-icon">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="Cast" name="Cast"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value="">Caste Restriction?</option>
                            <option value="General">General</option>
                            <option value="OBC (Other Backward Classes)">OBC (Other Backward Classes)</option>
                            <option value="SC (Scheduled Cast)">SC (Scheduled Cast)</option>
                            <option value="ST(Scheduled Type)">ST (Scheduled Type)</option>

                        </select>
                    </div>

                    <div class="input-icon">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="mutation" name="mutation"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value="">Mutation Done?</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="input-icon">
                        <i class="fas fa-border-all"></i>
                        <select id="boundary" name="boundary"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value="">Boundary Wall?</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>


            <div class="section">
                <h2>3️⃣ Purpose of Buying</h2>
                <select id="purpose" name="purpose"
                    class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    required>
                    <option value="">Purpose of Buying</option>
                    <option value="Self House">Self House</option>
                    <option value="Investment">Investment</option>
                    <option value="Commercial Purpose">Commercial Purpose</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Submit</button>

            <div id="successMsg"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('plotForm');
        const submitBtn = document.getElementById('submitBtn');
        const successMsg = document.getElementById('successMsg');
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbQtzyz6JehsWs94IQEegjmnZy72P5Y0MuelqHIjIuNjMID4P4mpKh3acJDvWF8cE/exec'; // <--- PASTE YOUR URL HERE

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = "Submitting...";

            // Collect data including the "Other" inputs
            const formData = new FormData(form);

            // If "Other" was selected for plot type, ensure we send the manual value
            if (formData.get('plotType') === 'other') {
                formData.set('plotType', document.getElementById('otherPlotTypeInput').value);
            }

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Submit";
                    successMsg.innerHTML = "✅ Form submitted successfully! We will contact you soon.";
                    form.reset();
                    // Hide conditional inputs after reset
                    document.getElementById("otherPlotTypeInput").style.display = "none";
                    document.getElementById("khataOther").style.display = "none";
                })
                .catch(error => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Submit";
                    successMsg.innerHTML = "❌ Error submitting form. Please try again.";
                    console.error('Error!', error.message);
                });
        });
    </script>
</body>

</html>
<!----done-->
