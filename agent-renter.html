<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent for Renter Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f7;
            padding: 25px;
        }

        .form-box {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #004ecc;
        }
    </style>

</head>

<body>



    <div class="form-box">
        <h2>Agent Registration – For Renter</h2>
        <form id="agentRegistrationForm" method="POST">

            <label>Agent Full Name</label>
            <input type="text" name="fullName" placeholder="Enter full name" required>

            <label>Mobile Number</label>
            <input type="tel" name="mobile" maxlength="12" placeholder="Enter mobile number" required>

            <label>Email (Optional)</label>
            <input type="email" name="email" placeholder="Enter email">

            <label>Aadhar Number (Last 4 digits only)</label>
            <input type="text" name="aadhar" maxlength="4" placeholder="xx00" required>

            <label>Agent Type</label>
            <select name="agentType" required>
                <option value="">Select</option>
                <option>Individual Agent</option>
                <option>Brokerage Firm</option>
                <option>Real Estate Consultant</option>
                <option>Channel Partner</option>
            </select>

            <label>Experience Level</label>
            <select name="experience" required>
                <option>New (0-1 Year)</option>
                <option>Experienced (1-5 Years)</option>
                <option>Senior (5+ Years)</option>
            </select>


            <label>Renter Category You Handle</label>
            <select name="renterCategory" required>
                <option>Residential Renter</option>
                <option>Commercial Renter</option>
                <option>Industrial Renter</option>
                <option>Godown / Warehouse Renter</option>
                <option>All Renter Categories</option>
            </select>

            <label>Do you currently have any renter clients?</label>
            <select name="renterOnHand" required>
                <option>No</option>
                <option>Yes – Residential</option>
                <option>Yes – Commercial</option>
                <option>Yes – Industrial</option>
                <option>Yes – Warehouse</option>
            </select>

            <label>If Yes, Provide Renter Requirements</label>
            <textarea rows="3" name="renterRequirements"
                placeholder="Rent budget, Size, Location, Purpose, etc."></textarea>

            <label>Preferred Working Location</label>
            <input type="text" name="workLocation" placeholder="City / Area / District" required>

            <label>Your Expected Commission from Renter</label>
            <select name="expectedCommission" required>
                <option>50% of one month rent</option>
                <option>75% of one month rent</option>
                <option>100% of one month rent</option>
                <option>As per mutual agreement</option>
            </select>

            <label>Are you ready to follow A2ZTechProperty legal guidelines?</label>
            <select name="legalGuideline" required>
                <option>Yes</option>
                <option>No</option>
            </select>

            <label>Do you have an Agent Reference Number?</label>
            <select id="refSelect" name="refSelect" onchange="toggleRefInput()">
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <input type="text" id="refNumber" name="refNumber" placeholder="Enter Agent Reference Number"
                style="display:none; margin-top:8px;">

            <script>
                // Existing script to show/hide reference number input
                function toggleRefInput() {
                    const select = document.getElementById("refSelect");
                    const input = document.getElementById("refNumber");

                    if (select.value === "yes") {
                        input.style.display = "block";
                        input.required = true;
                    } else {
                        input.style.display = "none";
                        input.required = false;
                        input.value = "";
                    }
                }
            </script>

            <label>How Did You Hear About Us?</label>
            <select name="hearAboutUs">
                <option>WhatsApp</option>
                <option>Google</option>
                <option>Facebook</option>
                <option>Instagram</option>
                <option>Referral</option>
                <option>Other</option>
            </select>

            <button type="submit">Submit Registration</button>
        </form>

        <div id="formStatus" style="margin-top: 20px; font-weight: bold;"></div>

        <script>
            // ** IMPORTANT: REPLACE THE URL BELOW WITH YOUR DEPLOYED APPS SCRIPT WEB APP URL **
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxigHsn5f2_yK6Ako6VULdEBILN_ceEG79a04yLdPPbz7Hs1geqOgpUdwy2_pwMTK98/exec';

            const form = document.getElementById('agentRegistrationForm');
            const statusDiv = document.getElementById('formStatus');

            form.addEventListener('submit', function (e) {
                e.preventDefault(); // Stop the form from submitting the traditional way
                statusDiv.textContent = 'Submitting...';
                statusDiv.style.color = 'blue';
                const submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true; // Disable button

                const formData = new FormData(form);
                const urlEncodedData = new URLSearchParams(formData).toString();

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: urlEncodedData
                })
                    .then(response => {
                        return response.json();
                    })
                    .then(data => {
                        submitButton.disabled = false; // Re-enable button
                        if (data.result === 'success') {
                            statusDiv.textContent = '✅ ' + data.message;
                            statusDiv.style.color = 'green';
                            form.reset(); // Clear the form
                            document.getElementById("refNumber").style.display = "none";
                        } else {
                            statusDiv.textContent = '❌ Submission Error: ' + data.message;
                            statusDiv.style.color = 'red';
                        }
                    })
                    .catch(error => {
                        submitButton.disabled = false; // Re-enable button
                        statusDiv.textContent = '❌ Network Error: Could not connect to the server.';
                        statusDiv.style.color = 'red';
                        console.error('Fetch error:', error);
                    });
            });
        </script>
    </div>

</body>

</html>
