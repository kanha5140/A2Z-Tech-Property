<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Services Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        .form-container {
            max-width: 750px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #0072ff;
            color: white;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005bd1;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Partner Services Registration Form</h2>

        <form id="registrationForm">
            <!-- Partner Information -->
            <label>Full Name / Business Owner Name</label>
            <input type="text" id="name" name="name" placeholder="Enter name" required />

            <label>Business / Company Name</label>
            <input type="text" id="companyname" name="companyname" placeholder="Enter company name" required />

            <label>Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required />

            <label>Alternate Number (Optional)</label>
            <input type="tel" id="alternate" name="alternate" placeholder="Alternate contact number" />

            <label>Email</label>
            <input type="email" id="email" name="email" placeholder="Enter email" />

            <label>Business Address / Office Address</label>
            <input type="text" id="address" name="address" placeholder="Street, Area, City" required />

            <!-- Partner Category -->
            <label>Select Partner Category</label>
            <select id="category" name="category" required>
                <option value="">Select</option>
                <option>Architecture Partner</option>
                <option>Vastu Consultant Partner</option>
                <option>Construction Contractor</option>
                <option>Renovation & Reconstruction Partner</option>
                <option>Demolition Contractor</option>
                <option>Material Supplier / Manufacturer / Dealer</option>
                <option>Technical Vehicle Provider (JCB, Tractor, Dumper, etc.)</option>
                <option>Interior Designer Partner</option>
                <option>Electrician / Plumber Partner</option>
                <option>Land Developer</option>
            </select>

            <!-- Experience -->
            <label>Experience in This Field</label>
            <select id="experience" name="experience" required>
                <option value="">Select</option>
                <option>0 - 1 Year</option>
                <option>1 - 3 Years</option>
                <option>3 - 5 Years</option>
                <option>5+ Years</option>
            </select>


            <label>GST No. (If Available)</label>
            <input type="text" id="gst" name="gst" placeholder="GST Number" />

            <label>Website / Social Media Link (Optional)</label>
            <input type="text" id="website" name="website" placeholder="Website URL or Social Media Page" />
            <!-- Service Areas -->
            <label>Service Area / City Coverage</label>
            <input type="text" id="servicearea" name="servicearea" placeholder="City / District / Region" required />

            <!-- Additional Details -->
            <label>Describe Your Services</label>
            <textarea rows="3" id="servicesdescription" name="servicesdescription"
                placeholder="Brief description of your services, specialization, work type..." required></textarea>


            <label>How Did You Hear About Us?</label>
            <select id="hearaboutus" name="hearaboutus">
                <option>Google</option>
                <option>WhatsApp</option>
                <option>Social Media</option>
                <option>Referral</option>
                <option>Other</option>
            </select>

            <button type="submit">Submit Registration</button>

        </form>
        <script>
            const scriptURL = 'https://script.google.com/macros/s/AKfycbyqkPMOk5CV5AXFnd_X25D7r0Ko-viK_JAL83qBpZGOtBUrg87u17AzhfzgImUoVAA/exec';
            const form = document.getElementById('registrationForm');

            form.addEventListener('submit', e => {
                e.preventDefault();

                // Change button text to show it's working
                const submitBtn = form.querySelector('button');
                const originalBtnText = submitBtn.innerText;
                submitBtn.disabled = true;
                submitBtn.innerText = "Submitting...";

                fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                    .then(response => {
                        alert('Success! Your registration has been submitted.');
                        submitBtn.disabled = false;
                        submitBtn.innerText = originalBtnText;
                        form.reset();
                    })
                    .catch(error => {
                        console.error('Error!', error.message);
                        alert('Error! Please try again later.');
                        submitBtn.disabled = false;
                        submitBtn.innerText = originalBtnText;
                    });
            });
        </script>
    </div>
</body>

</html>
