<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Materials Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        .form-container {
            max-width: 820px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.18);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-top: 6px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0066ff;
            color: white;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            margin-top: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #004fc0;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Vendor Materials Registration Form</h2>
        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Vendor Registration</title>
            <style>
                /* Basic styling for the form */
                body {
                    font-family: Arial, sans-serif;
                    margin: 20px;
                }

                label {
                    display: block;
                    margin-top: 10px;
                }

                input,
                select,
                textarea {
                    width: 100%;
                    padding: 8px;
                    margin-top: 5px;
                }

                button {
                    margin-top: 20px;
                    padding: 10px;
                    background-color: #4CAF50;
                    color: white;
                    border: none;
                    cursor: pointer;
                }

                button:disabled {
                    background-color: #ccc;
                    cursor: not-allowed;
                }

                #loading {
                    display: none;
                    color: blue;
                    margin-top: 10px;
                }

                #success {
                    display: none;
                    color: green;
                    margin-top: 10px;
                }

                #error {
                    display: none;
                    color: red;
                    margin-top: 10px;
                }
            </style>
        </head>

        <body>
            <form id="vendorForm"
                action="https://script.google.com/macros/s/AKfycbwtf_NJx6IeObApaIgp3vqHQP8itRstlL2-Xq0W_5aJZ1WymcVUpEb0C1W6Cy5m7yUu/exec"
                method="post">
                <!-- Business Info -->
                <label>Business / Shop Name</label>
                <input type="text" id="shopName" name="shopName" placeholder="Enter business name" required>

                <label>Owner / Contact Person Name</label>
                <input type="text" id="ownerName" name="ownerName" placeholder="Owner full name" required>

                <label>Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Primary mobile number" required>

                <label>Alternate Mobile (Optional)</label>
                <input type="tel" id="AltMobile" name="AltMobile" placeholder="Alternate number">

                <label>Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter email" required>

                <!-- Address -->
                <label>Business Address</label>
                <textarea rows="2" id="bAddress" name="bAddress" placeholder="Shop / Godown Address"
                    required></textarea>

                <label>City / Area</label>
                <input type="text" id="Area" name="Area" placeholder="Enter city" required>

                <!-- GST -->
                <label>GST Number (If available)</label>
                <input type="text" id="gstNumber" name="gstNumber" placeholder="GSTIN">

                <!-- Main Category -->
                <label>Select Material Category</label>
                <select id="materialCategory" name="materialCategory" required onchange="showOtherInput()">
                    <option value="">Select Category</option>
                    <option>Construction Materials</option>
                    <option>Electrical Materials</option>
                    <option>Plumbing Materials</option>
                    <option>Tiles & Flooring</option>
                    <option>Paints & Waterproofing</option>
                    <option>Doors & Windows</option>
                    <option>Interior & Finishing</option>
                    <option>Industrial & Heavy Materials</option>
                    <option value="other">Other (Write Manually)</option>
                </select>

                <!-- Hidden Input Box -->
                <input type="text" id="otherCategoryInput" name="otherCategoryInput" placeholder="Enter your category"
                    style="display:none; margin-top:10px;">

                <label>Materials You Supply (Select multiple)</label>
                <select id="materialsSupply" name="materialsSupply" multiple size="10" required
                    onchange="showOtherSupplyInput()">
                    <!-- Construction -->
                    <option>Cement</option>
                    <option>Steel (TMT Bars)</option>
                    <option>Bricks</option>
                    <option>Sand / M-Sand</option>
                    <option>Stone Chips</option>
                    <option>AAC Blocks</option>
                    <option>RMC Concrete</option>

                    <!-- Electrical -->
                    <option>Wires & Cables</option>
                    <option>Switches / Boards</option>
                    <option>LED Lights</option>
                    <option>MCB / Distribution Box</option>

                    <!-- Plumbing -->
                    <option>PVC Pipes</option>
                    <option>CPVC Pipes</option>
                    <option>Sanitary Fittings</option>

                    <!-- Tiles -->
                    <option>Floor Tiles</option>
                    <option>Wall Tiles</option>
                    <option>Granite</option>
                    <option>Marble</option>

                    <!-- Paints -->
                    <option>Interior Paint</option>
                    <option>Exterior Paint</option>
                    <option>Putty / Primer</option>
                    <option>Waterproofing Products</option>

                    <!-- Doors -->
                    <option>Wooden Doors</option>
                    <option>UPVC Windows</option>
                    <option>Aluminium Windows</option>

                    <!-- Interior -->
                    <option>False Ceiling Materials</option>
                    <option>Modular Kitchen Accessories</option>
                    <option>Hardware & Fittings</option>

                    <!-- Industrial -->
                    <option>Binding Wire</option>
                    <option>Shuttering Plywood</option>
                    <option>Industrial Cement</option>
                    <option>Heavy Machinery Materials</option>

                    <!-- Manual Entry -->
                    <option value="other">Other (Write Manually)</option>
                </select>

                <!-- Hidden Input -->
                <input type="text" id="otherSupplyInput" name="otherSupplyInput" placeholder="Enter other materials"
                    style="display:none; margin-top:10px;">

                <!-- Delivery Options -->
                <label>Do You Provide Delivery?</label>
                <select id="ProvideDelivery" name="ProvideDelivery" required>
                    <option value="">Select</option>
                    <option>Yes, Free Delivery</option>
                    <option>Yes, Paid Delivery</option>
                    <option>No Delivery (Customer Pickup Only)</option>
                </select>

                <label>Service Areas You Cover</label>
                <input type="text" id="ServiceArea" name="ServiceArea"
                    placeholder="Example: Rourkela, Rajgangpur, Sundargarh">

                <!-- Business Experience -->
                <label>Years of Experience</label>
                <select id="Experience" name="Experience" required>
                    <option>1-2 Years</option>
                    <option>3-5 Years</option>
                    <option>5-10 Years</option>
                    <option>10+ Years</option>
                </select>

                <!-- Additional Info -->
                <label>Additional Information (Optional)</label>
                <textarea id="AdditionalInformation" name="AdditionalInformation" rows="3"
                    placeholder="Any special offer, quality guarantee, delivery terms..."></textarea>

                <button type="submit" id="submitBtn">Submit Vendor Registration</button>
                <div id="loading">Submitting... Please wait</div>
                <div id="success">Registration submitted successfully!</div>
                <div id="error">An error occurred. Please try again.</div>
            </form>

            <script>
                function showOtherInput() {
                    const selectBox = document.getElementById("materialCategory");
                    const otherInput = document.getElementById("otherCategoryInput");

                    if (selectBox.value === "other") {
                        otherInput.style.display = "block";
                        otherInput.required = true;
                    } else {
                        otherInput.style.display = "none";
                        otherInput.required = false;
                        otherInput.value = "";
                    }
                }

                function showOtherSupplyInput() {
                    const selectBox = document.getElementById("materialsSupply");
                    const otherInput = document.getElementById("otherSupplyInput");

                    // Convert selected options to array of values
                    const selectedValues = Array.from(selectBox.selectedOptions).map(opt => opt.value);

                    if (selectedValues.includes("other")) {
                        otherInput.style.display = "block";
                        otherInput.required = true;
                    } else {
                        otherInput.style.display = "none";
                        otherInput.required = false;
                        otherInput.value = "";
                    }
                }

                // Handle form submission with loading and success message
                document.getElementById('vendorForm').addEventListener('submit', function (e) {
                    e.preventDefault(); // Prevent default form submission

                    const form = this;
                    const submitBtn = document.getElementById('submitBtn');
                    const loading = document.getElementById('loading');
                    const success = document.getElementById('success');
                    const error = document.getElementById('error');

                    // Hide previous messages
                    success.style.display = 'none';
                    error.style.display = 'none';

                    // Show loading and disable button
                    loading.style.display = 'block';
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Submitting...';

                    // Collect form data
                    const formData = new FormData(form);

                    // Submit via fetch
                    fetch(form.action, {
                        method: 'POST',
                        body: formData
                    })
                        .then(response => {
                            if (response.ok) {
                                // Assume success if response is ok
                                loading.style.display = 'none';
                                success.style.display = 'block';
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Submit Vendor Registration';
                                form.reset(); // Optional: reset form after success
                            } else {
                                throw new Error('Submission failed');
                            }
                        })
                        .catch(err => {
                            loading.style.display = 'none';
                            error.style.display = 'block';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Submit Vendor Registration';
                            console.error(err);
                        });
                });
            </script>
        </body>

        </html>
    </div>

</body>

</html>
