<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm House Buyer Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 25px;
        }

        .form-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #0072ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #0059cc;
        }
    </style>
</head>

<body>

    <div class="form-box">
        <h2>Farm House Purchase Form</h2>

        <form id="farmHouseForm">
            <label>Full Name</label>
            <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>

            <label>Mobile Number</label>
            <input type="tel" id="mobile-number" name="mobile-number" placeholder="Enter mobile number" required>

            <label>Alternate Number (Optional)</label>
            <input type="tel" id="alternate-number" name="alternate-number" placeholder="Alternate contact">

            <label>Email (Optional)</label>
            <input type="email" id="email" name="email" placeholder="Enter email">

            <label>Preferred Location</label>
            <input type="text" id="preferred-location" name="preferred-location" placeholder="Village / Area / City"
                required>

            <label>Total Budget (₹)</label>
            <input type="text" id="totalBudget" name="totalBudget" placeholder="Example: ₹10 lakh – ₹50 lakh" required>

            <label>Required Farm House Land Size</label>
            <select id="landSize" name="landSize" required>
                <option value>Select</option>
                <option>10,000 sq.ft – 20,000 sq.ft</option>
                <option>½ Acre</option>
                <option>1 Acre</option>
                <option>2–5 Acres</option>
                <option>More than 5 Acres</option>
            </select>

            <label>Farm House Purpose</label>
            <select id="farmPurpose" name="farmPurpose" required>
                <option>Personal Use</option>
                <option>Holiday Home</option>
                <option>Resort Development</option>
                <option>Agriculture + Farm Stay</option>
                <option>Investment</option>
            </select>

            <label>Road Connectivity Requirement</label>
            <select id="roadConnectivity" name="roadConnectivity" required>
                <option>Any</option>
                <option>8 ft Road</option>
                <option>12–20 ft Road</option>
                <option>30 ft Road</option>
                <option>Highway Touch Preferred</option>
            </select>

            <label>Water Source Required</label>
            <select id="waterSource" name="waterSource" required>
                <option>Borewell</option>
                <option>River / Canal</option>
                <option>Pond Access</option>
                <option>Any water source is fine</option>
            </select>

            <label>Electricity Requirement</label>
            <select id="electricityRequirement" name="electricityRequirement" required>
                <option>Not Required</option>
                <option>Near By Transformer</option>
                <option>Electricity Connection Must</option>
            </select>

            <label>Legal Requirement</label>
            <select id="LegalRequirment" name="LegalRequirment" required>
                <option>Clear Title Only</option>
                <option>Patta / Mutation Available</option>
                <option>Farm Land Registration OK</option>
                <option>Any, will verify</option>
            </select>

            <label>Distance Preference</label>
            <select id="distancePreference" name="distancePreference" required>
                <option>Within 5 km from city</option>
                <option>Within 10 km</option>
                <option>Within 15 km</option>
                <option>More than 15 km</option>
            </select>

            <label>Site Visit Preferred Date</label>
            <input type="date" id="siteVisitDate" name="siteVisitDate" required>

            <!-- Legal & Documentation Section -->
            <div class="bg-gray-50 p-6 rounded-lg">
                <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-file-contract mr-2 text-orange-600"></i> Legal & Documentation
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="input-icon">
                        <i class="fas fa-file-alt"></i>
                        <select name="khataType" id="khataType"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required onchange="showKhataOther()">

                            <option value>Khata Type</option>
                            <option value="Sabik">Sabik</option>
                            <option value="Hal">Hal</option>
                            <option value="Kisam">Kisam</option>
                            <option value="other">Other (Specify)</option>
                        </select>

                        <input type="text" id="khataOther" name="khataOther" placeholder="Please specify Khata Type"
                            class="w-full border border-gray-300 p-3 rounded-lg mt-2" style="display:none;">

                        <script>
                            function showKhataOther() {
                                const select = document.getElementById("khataType");
                                const input = document.getElementById("khataOther");

                                if (select.value === "other") {
                                    input.style.display = "block";
                                    input.required = true;
                                } else {
                                    input.style.display = "none";
                                    input.required = false;
                                    input.value = "";
                                }
                            }
                        </script>
                    </div>
                    <div class="input-icon">
                        <i class="fas fa-ruler-combined"></i>
                        <input type="text" id="Khatanumber" name="Khatanumber"
                            placeholder="Khata Number(e.g., 1200, 3400)"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required />
                    </div>

                    <div class="input-icon">
                        <i class="fas fa-ruler-combined"></i>
                        <input type="text" id="plotNumber" name="plotNumber" placeholder="Plot Number (e.g., B1, C2 )"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required />
                    </div>

                    <div class="input-icon">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="Religious" name="Religious"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value>Religious Restriction?</option>
                            <option value="Hindu">Hindu</option>
                            <option value="Muslim">Muslim</option>
                            <option value="Sikh">Sikh</option>
                            <option value="Christian">Christian</option>
                            <option value="Buddh"> budh</option>
                            <option value="Jain">Jain</option>
                        </select>
                    </div>

                    <div class="input-icon">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="Cast" name="Cast"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value>Caste Restriction?</option>
                            <option value="General">General</option>
                            <option value="OBC (Other Backward Classes)">OBC (Other Backward
                                Classes)</option>
                            <option value="SC (Scheduled Cast)">SC (Scheduled Cast)</option>
                            <option value="ST(Scheduled Type)">ST (Scheduled Type)</option>

                        </select>
                    </div>

                    <div class="input-icon">
                        <i class="fas fa-exchange-alt"></i>
                        <select id="mutation" name="mutation"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value>Mutation Done?</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="input-icon">
                        <i class="fas fa-border-all"></i>
                        <select id="boundary" name="boundary"
                            class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            required>
                            <option value>Boundary Wall?</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>
            <!-- Additional Information -->
            <label>Additional Requirements (Optional)</label>
            <textarea id="additionalRequirements" name="additionalRequirements" rows="3"
                placeholder="Example: River view, fenced land, boundary wall, etc."></textarea>

            <label>How Did You Hear About Us?</label>
            <select id="howYouHearAboutUs" name="howYouHearAboutUs">
                <option>Google</option>
                <option>WhatsApp</option>
                <option>Social Media</option>
                <option>Referral</option>
                <option>Other</option>
            </select>

            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbweP6lakpdTSQPgBUh159Vt0S23aSJztgyAT1M0vKAekdnR5gIoD8nPqVxg0naC8VCc/exec'; // PASTE YOUR URL HERE
        const form = document.getElementById('farmHouseForm');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "Submitting...";

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    alert("Success! Your requirements have been submitted.");
                    btn.disabled = false;
                    btn.innerText = "Submit";
                    form.reset();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert("Something went wrong. Please try again.");
                    btn.disabled = false;
                    btn.innerText = "Submit";
                });
        });
    </script>
</body>

</html>
