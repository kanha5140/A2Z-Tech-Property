<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commercial Property Buyer Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef1f4;
      margin: 0;
      padding: 25px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 28px;
      font-size: 17px;
      font-weight: 600;
      background: #0b6b3a;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #084f2d;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>Commercial Property Purchase Form</h2>
    <form id="propertyForm">

      <label>Full Name</label>
      <input type="text" name="fullName" placeholder="Enter your full name" required />

      <label>Mobile Number</label>
      <input type="tel" name="mobile" placeholder="Enter mobile number" required />

      <label>Email (Optional)</label>
      <input type="email" name="email" placeholder="Enter email" />

      <label>Commercial Property Type</label>
      <select id="commercialType2" name="commercialType" required onchange="showOtherCommercialType2()">
        <option value="">Select</option>
        <option value="Shop">Shop</option>
        <option value="Office Space">Office Space</option>
        <option value="Showroom">Showroom</option>
        <option value="Godown / Warehouse">Godown / Warehouse</option>
        <option value="Commercial Building">Commercial Building</option>
        <option value="Industrial Shed">Industrial Shed</option>
        <option value="Commercial Plot">Commercial Plot</option>
        <option value="other">Other (Write Manually)</option>
      </select>
      <input type="text" id="otherCommercialTypeInput2" name="otherCommercialType"
        placeholder="Enter commercial property type" style="display:none; margin-top:10px;">

      <label>Purpose of Buying</label>
      <select id="purposeBuying" name="purpose" required onchange="showOtherPurposeBuying()">
        <option value="">Select</option>
        <option value="Business Setup">Business Setup</option>
        <option value="Branch Office">Branch Office</option>
        <option value="Investment">Investment</option>
        <option value="Rental Income">Rental Income</option>
        <option value="Storage / Distribution">Storage / Distribution</option>
        <option value="other">Other (Write Manually)</option>
      </select>
      <input type="text" id="otherPurposeBuyingInput" name="otherPurpose" placeholder="Enter purpose"
        style="display:none; margin-top:10px;">

      <label>Preferred Location</label>
      <input type="text" name="location" placeholder="Area / Landmark / City" required />

      <label>Budget Range (₹)</label>
      <input type="text" name="budget" placeholder="Example: ₹20 Lakh – ₹80 Lakh" required />

      <label>Built-up Area Required (Sqft)</label>
      <input type="text" name="area" placeholder="Example: 300 sqft / 1200 sqft / 5000 sqft" />

      <label>Floor Preference</label>
      <select name="floor">
        <option>No Preference</option>
        <option>Ground Floor</option>
        <option>1st Floor</option>
        <option>Upper Floors</option>
      </select>

      <label>Frontage Requirement (Optional)</label>
      <input type="text" name="frontage" placeholder="Example: Minimum 15 ft" />

      <label>Road Size Requirement (Optional)</label>
      <input type="text" name="roadSize" placeholder="Example: Minimum 30 ft Road" />

      <label>Parking Requirement</label>
      <select name="parking">
        <option>No Preference</option>
        <option>2 Wheeler</option>
        <option>4 Wheeler</option>
        <option>Both</option>
      </select>

      <label>Possession Preference</label>
      <select name="possession">
        <option>Immediate</option>
        <option>Within 1 Month</option>
        <option>1–3 Months</option>
        <option>Flexible</option>
      </select>

      <select name="khataType" id="khataType" required onchange="showKhataOther()">
        <option value="">Khata Type</option>
        <option value="Sabik">Sabik</option>
        <option value="Hal">Hal</option>
        <option value="Kisam">Kisam</option>
        <option value="other">Other (Specify)</option>
      </select>
      <input type="text" id="khataOther" name="khataOther" placeholder="Please specify Khata Type"
        style="display:none;">

      <input type="text" name="Khatanumber" placeholder="Khata Number" required />
      <input type="text" name="plotNumber" placeholder="Plot Number" required />

      <select name="Religious" required>
        <option value="">Religious Restriction?</option>
        <option value="Hindu">Hindu</option>
        <option value="Muslim">Muslim</option>
      </select>

      <select name="Cast" required>
        <option value="">Caste Restriction?</option>
        <option value="General">General</option>
        <option value="OBC">OBC</option>
        <option value="SC">SC</option>
        <option value="ST">ST</option>
      </select>

      <select name="mutation" required>
        <option value="">Mutation Done?</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <select name="boundary" required>
        <option value="">Boundary Wall?</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label>Additional Requirements</label>
      <textarea name="additional" rows="3" placeholder="Facing, Vaastu, etc."></textarea>

      <label>How Did You Hear About Us?</label>
      <select name="source">
        <option>Google</option>
        <option>WhatsApp</option>
        <option>Social Media</option>
        <option>Referral</option>
        <option>Other</option>
      </select>

      <button type="submit" id="submitBtn">Submit Requirement</button>

    </form>
   
    <script>
      const scriptURL = 'https://script.google.com/macros/s/AKfycbyE7cn57FhqHaffrbDINi-RV5rEbZBifQUcBic5cQeLf9NBjXG2HDJ4CHZm_cq0j9E/exec';
      const form = document.getElementById('propertyForm');
      const btn = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMessage');

      form.addEventListener('submit', e => {
        e.preventDefault();

        // UI Feedback: Disable button and show loading state
        btn.disabled = true;
        btn.innerText = "Submitting...";
        btn.style.opacity = "0.7";

        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
          .then(response => {
            // 1. Show the success message
            successMsg.classList.remove('hidden');

            // 2. Reset the button
            btn.disabled = false;
            btn.innerText = "Submit Requirement";
            btn.style.opacity = "1";

            // 3. Clear the form
            form.reset();

            // 4. Automatically hide the message after 5 seconds
            setTimeout(() => {
              successMsg.classList.add('hidden');
            }, 5000);
          })
          .catch(error => {
            console.error('Error!', error.message);
            alert("Something went wrong. Please try again.");
            btn.disabled = false;
            btn.innerText = "Submit Requirement";
            btn.style.opacity = "1";
          });
      });
    </script>
  </div>

</body>

</html>
