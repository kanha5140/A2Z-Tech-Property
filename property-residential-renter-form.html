<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Rent Forms</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-button {
            flex: 1;
            padding: 10px;
            background-color: #ddd;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px 8px 0 0;
        }

        .tab-button.active {
            background-color: #28a745;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .container {
            max-width: 820px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0a6b3c;
            color: white;
            border: none;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #074f2b;
        }

        .renter-button {
            background: #0072ff;
        }

        .renter-button:hover {
            background: #0059cc;
        }
    </style>
</head>

<body>
    <div class="tabs">
        <button class="tab-button active" onclick="showTab(0)">Renter Form</button>
        <button class="tab-button" onclick="showTab(1)">Owner Form</button>
    </div>

    <div class="tab-content active">
        <div class="container">
            <h2>Residential Renter Form</h2>
            <form id="residentialRenterForm" action="https://script.google.com/macros/s/AKfycbzGwLl-NK92JxN1dPUL3SxRFWY4W5_V-BcP0EKVJzCQ4Q7jBMSz_mlGVl2csqBQJSJS/exec" method="POST">
                <label>Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required />

                <label>Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required />

                <label>Alternate Mobile (Optional)</label>
                <input type="tel" id="altMobile" name="altMobile" placeholder="Alternate number" />

                <label>Email (Optional)</label>
                <input type="email" id="email" name="email" placeholder="Enter email" />

                <label>Property Type</label>
                <select id="pType" name="pType" required>
                    <option value="">Select</option>
                    <option>Residential House</option>
                    <option>Residential Room</option>
                    <option>Residential Flat</option>
                    <option>Apartment</option>
                    <option>Duplex</option>
                    <option>Villa</option>
                    <option>others</option>
                </select>

                <label>Floor Preference (If Flat / Apartment)</label>
                <select id="FloorPref" name="FloorPref">
                    <option>Ground Floor</option>
                    <option>1st Floor</option>
                    <option>2nd Floor</option>
                    <option>3rd Floor</option>
                    <option>Above 3rd Floor</option>
                    <option>No Preference</option>
                </select>

                <label>Preferred Location</label>
                <input type="text" id="pLocation" name="pLocation" placeholder="Area / City" required />

                <label>Budget Range per Month</label>
                <input type="text" id="BudgetPreMonth" name="BudgetPreMonth" placeholder="Example: ₹5,000 - ₹15,000"
                    required />

                <label>Property Size Required</label>
                <input type="text" id="propertySize" name="propertySize"
                    placeholder="Example: 1BHK / 2 Rooms / 500 sqft" />

                <label>Purpose of Rent</label>
                <select id="PurposeOR" name="PurposeOR" required>
                    <option value="">Select</option>
                    <option>Living</option>
                    <option>Office</option>
                    <option>Shop</option>
                    <option>Business Setup</option>
                </select>

                <label>Occupancy Type</label>
                <select id="Occupancy" name="Occupancy" required>
                    <option>Single</option>
                    <option>Family</option>
                    <option>Group</option>
                    <option>Company Staff</option>
                </select>

                <label>Parking Required?</label>
                <select id="parking" name="parking">
                    <option>No</option>
                    <option>2 Wheeler</option>
                    <option>4 Wheeler</option>
                    <option>Both</option>
                </select>

                <label>Furnishing Requirement</label>
                <select id="furnishing" name="furnishing">
                    <option>Unfurnished</option>
                    <option>Semi-Furnished</option>
                    <option>Fully Furnished</option>
                </select>

                <label>How Soon Do You Need the Property?</label>
                <select id="needTime" name="needTime" required>
                    <option>Immediately</option>
                    <option>Within 1 Week</option>
                    <option>This Month</option>
                    <option>Just Checking</option>
                </select>

                <label>Site Visit Preferred Date</label>
                <input type="date" id="visitDate" name="visitDate" />

                <label>Additional Requirements (Optional)</label>
                <textarea rows="3" id="addrequirment" name="addrequirment"
                    placeholder="Any special requirement..."></textarea>

                <label>How Did You Hear About Us?</label>
                <select id="hearAboutUs" name="hearAboutUs" required>
                    <option>Google</option>
                    <option>WhatsApp</option>
                    <option>Social Media</option>
                    <option>Referral</option>
                    <option>Other</option>
                </select>

                <button type="submit" class="renter-button" id="submitBtn">
                    <span id="btnText">Submit</span>
                    <span id="spinner" class="hidden"></span>
                    <!-- Simple spinner emoji; replace with CSS spinner if needed -->
                </button>

            </form>

            <script>
                document.getElementById('residentialRenterForm').addEventListener('submit', function (e) {
                    e.preventDefault(); // Prevent default form submission

                    var form = this;
                    var button = document.getElementById('submitBtn');
                    var btnText = document.getElementById('btnText');
                    var spinner = document.getElementById('spinner');
                    var successMsg = document.getElementById('successMsg');

                    // Show animation: Disable button, show spinner, change text
                    button.disabled = true;
                    btnText.textContent = 'Submitting...';
                    spinner.classList.remove('hidden');
                    successMsg.classList.add('hidden'); // Hide any previous success message

                    // Prepare form data
                    var formData = new FormData(form);

                    // Submit via fetch
                    fetch(form.action, {
                        method: 'POST',
                        body: formData
                    })
                        .then(response => response.text())
                        .then(data => {
                            if (data.trim() === 'Success') {
                                // Success: Show message, reset form
                                successMsg.classList.remove('hidden');
                                form.reset();
                            } else {
                                alert('Submission failed: ' + data); // Handle errors (optional)
                            }
                        })
                        .catch(error => {
                            alert('Error: ' + error.message); // Handle network errors
                        })
                        .finally(() => {
                            // Reset animation: Re-enable button, hide spinner, restore text
                            button.disabled = false;
                            btnText.textContent = 'Submit';
                            spinner.classList.add('hidden');
                        });
                });
            </script>
        </div>
    </div>

    <div class="tab-content">
        <div class="container">
            <h2>Residential Property Rent – Owner Form</h2>
            <form id="residentialOwnerForm">
                <label>Owner Name</label>
                <input type="text" id="name1" name="name1" required />

                <label>Mobile Number</label>
                <input type="tel" id="number1" name="number1" required />

                <label>Property Type</label>
                <select id="pType1" name="pType1" required>
                    <option>Residential House</option>
                    <option>Flat / Apartment</option>
                    <option>Duplex</option>
                    <option>Villa</option>
                    <option>Other</option>
                </select>

                <label>Property Location</label>
                <input type="text" id="pLocation1" name="pLocation1" placeholder="Area / Landmark / City" required />

                <label>Property Size (Sqft)</label>
                <input type="number" id="propertySize1" name="propertySize1" placeholder="Example: 1200 sqft" />

                <label>Floor</label>
                <select id="Floor1" name="Floor1">
                    <option>Ground Floor</option>
                    <option>1st Floor</option>
                    <option>2nd Floor</option>
                    <option>Above 3rd Floor</option>
                </select>

                <label>Expected Rent (₹)</label>
                <input type="text" id="exRent1" name="exRent1" placeholder="Example: ₹8,000 / ₹25,000" />

                <label>Security Deposit (Optional)</label>
                <input type="text" id="sDeposit1" name="sDeposit1" />

                <label>Furnishing Status</label>
                <select id="fs" name="fs">
                    <option>Unfurnished</option>
                    <option>Semi-Furnished</option>
                    <option>Fully Furnished</option>
                </select>

                <label>Preferred Tenant Type</label>
                <select id="preTenentType1" name="preTenentType1">
                    <option>Family</option>
                    <option>Bachelor</option>
                    <option>Working Professionals</option>
                    <option>Company Lease</option>
                </select>


                <label>Property Description</label>
                <textarea rows="4" id="pDiscription1" name="pDiscription1"
                    placeholder="Rooms, amenities, parking, water supply, restrictions, etc."></textarea>

                <button type="submit">Submit Property</button>

                <p id="successMsg1" class="text-green-600 text-center font-semibold hidden">Form submitted successfully!
                </p>
            </form>

        </div>
    </div>

    <script>
        function showTab(tabIndex) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');
            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));
            tabs[tabIndex].classList.add('active');
            buttons[tabIndex].classList.add('active');
        }
    </script>
</body>

</html>
